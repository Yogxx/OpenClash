name: OpenClash Auto Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload ke GitHub Release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

      upload_telegram:
        description: 'Upload IPK/APK ke Telegram?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  PKG_NAME: luci-app-openclash
  TARGET: x86/64

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: ver
        run: |
          VER=$(grep 'PKG_VERSION:=' luci-app-openclash/Makefile | cut -d= -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        type: [ ipk, apk ]

    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y curl git tar zstd unzip jq \
            python3 python3-pyelftools python3-setuptools

      - name: Download SDK
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          mkdir -p sdk && cd sdk
          if [ "$MATRIX_TYPE" = "ipk" ]; then
            curl -Lf https://downloads.openwrt.org/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz | tar xJ
          else
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s "$BASE_URL/sha256sums" \
              | grep -oP 'openwrt-sdk[^\s]+\.tar\.zst' | head -1)

            if [ -z "$SDK_FILE" ]; then
              echo "❌ Gagal parse sha256sums, fallback ke HTML"
              SDK_FILE=$(curl -s "$BASE_URL/" \
                | grep -oP 'openwrt-sdk[^"<>\s]+\.tar\.zst' | head -1)
            fi

            if [ -z "$SDK_FILE" ]; then
              echo "❌ Tidak dapat menemukan SDK snapshot APK"
              exit 1
            fi

            echo "📦 Downloading SDK: $SDK_FILE"
            curl -Lf "$BASE_URL/$SDK_FILE" | tar --zstd -xf -
          fi

          SDK_DIR=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
          if [ -z "$SDK_DIR" ]; then
            echo "❌ Direktori SDK tidak ditemukan setelah ekstraksi"
            exit 1
          fi
          mv "$SDK_DIR" openwrt
          echo "✅ SDK siap di: sdk/openwrt"

      - name: Copy source
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          cp -r luci-app-openclash sdk/openwrt/package/
          # APK butuh luci-compat
          if [ "$MATRIX_TYPE" = "apk" ]; then
            find sdk/openwrt/package/luci-app-openclash -type f -name "Makefile" \
              -exec sed -i 's/DEPENDS:=+dnsmasq-full/DEPENDS:=+dnsmasq-full +luci-compat/g' {} \;
          fi

      - name: Update OpenClash resources
        run: |
          BASE=sdk/openwrt/package/luci-app-openclash/root
          TMP=tmp
          mkdir -p "$TMP"

          curl -sSL https://ispip.clang.cn/all_cn.txt -o "$TMP/china.ipset"
          curl -sSL https://ispip.clang.cn/all_cn_ipv6.txt -o "$TMP/china6.ipset"
          mkdir -p "$BASE/etc/openclash"
          cp "$TMP/china.ipset"  "$BASE/etc/openclash/china_ip_route.ipset"
          cp "$TMP/china6.ipset" "$BASE/etc/openclash/china_ip6_route.ipset"

          curl -sSL https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip -o "$TMP/metacubexd.zip"
          unzip -q "$TMP/metacubexd.zip" -d "$TMP"
          rm -rf "$BASE/usr/share/openclash/ui/metacubexd"
          mkdir -p "$BASE/usr/share/openclash/ui/metacubexd"
          cp -r "$TMP"/metacubexd-gh-pages/* "$BASE/usr/share/openclash/ui/metacubexd"

          curl -sSL https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip -o "$TMP/zashboard.zip"
          unzip -q "$TMP/zashboard.zip" -d "$TMP/zashboard"
          rm -rf "$BASE/usr/share/openclash/ui/zashboard"
          mkdir -p "$BASE/usr/share/openclash/ui/zashboard"
          cp -r "$TMP/zashboard/dist/"* "$BASE/usr/share/openclash/ui/zashboard"

          # Ekstrak font bendera (Twemoji) dari zashboard
          FONTS_PATH="$BASE/www/luci-static/resources/openclash/fonts"
          mkdir -p "$FONTS_PATH"
          TWEMOJI_FONT=$(ls "$TMP"/zashboard/dist/assets/TwemojiMozilla-flags-*.woff2 2>/dev/null | head -1)
          if [ -n "$TWEMOJI_FONT" ]; then
            cp "$TWEMOJI_FONT" "$FONTS_PATH/TwemojiMozilla-flags.woff2"
          fi

          TAG=$(curl -s https://api.github.com/repos/Loyalsoldier/v2ray-rules-dat/releases/latest | jq -r .tag_name)
          curl -sSL https://github.com/Loyalsoldier/v2ray-rules-dat/releases/download/$TAG/geosite.dat \
            -o "$BASE/etc/openclash/GeoSite.dat"

          curl -sSL https://github.com/alecthw/mmdb_china_ip_list/releases/latest/download/Country-lite.mmdb \
            -o "$BASE/etc/openclash/Country.mmdb"

      - name: Setup Node.js (Dibutuhkan untuk UI OpenClash)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Bundles & Minify CSS/JS
        run: |
          cd sdk/openwrt/package/luci-app-openclash/tools/codemirror
          # Install dependencies
          npm install
          # Build CodeMirror 6 core bundle
          npx esbuild entry.js --bundle --format=iife --global-name=CM6 --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/cm6.min.js --legal-comments=none --loader:.css=text
          # Build markdown preview bundle (lazy-loaded by CM6.ensureMarkdown)
          npx esbuild entry-md-render.js --bundle --format=iife --global-name=OCMarkdown --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/md-render.min.js --legal-comments=none --loader:.css=text
          # Build YAML lint worker (lazy-loaded by CM6.yamlLinter)
          npx esbuild entry-lint-worker.js --bundle --format=iife --minify --target=es2019 --outfile=../../root/www/luci-static/resources/openclash/js/lint-worker.min.js --legal-comments=none
          # Minify page scripts (skip prebuilt *.min.js)
          # --charset=utf8 menjaga byte non-ASCII tetap utuh (template compile di server butuh byte persis)
          JS_DIR="../../root/www/luci-static/resources/openclash/js"
          for js in "$JS_DIR"/*.js; do
            [ -f "$js" ] || continue
            case "$(basename "$js")" in *.min.js) continue ;; esac
            SIZE_BEFORE_JS=$(wc -c < "$js")
            npx esbuild "$js" --minify --charset=utf8 --target=es2019 --outfile="$js.tmp"
            mv "$js.tmp" "$js"
            SIZE_AFTER_JS=$(wc -c < "$js")
            echo "$(basename "$js") minified: ${SIZE_BEFORE_JS} -> ${SIZE_AFTER_JS} bytes ($(( 100 - SIZE_AFTER_JS * 100 / SIZE_BEFORE_JS ))% reduction)"
          done
          # Minify semua stylesheet
          CSS_DIR="../../root/www/luci-static/resources/openclash/css"
          for css in "$CSS_DIR"/*.css; do
            [ -f "$css" ] || continue
            SIZE_BEFORE=$(wc -c < "$css")
            npx lightningcss --minify --targets 'iOS >= 12, safari >= 12, android >= 4.4' "$css" -o "$css.tmp"
            mv "$css.tmp" "$css"
            SIZE_AFTER=$(wc -c < "$css")
            echo "$(basename "$css") minified: ${SIZE_BEFORE} -> ${SIZE_AFTER} bytes ($(( 100 - SIZE_AFTER * 100 / SIZE_BEFORE ))% reduction)"
          done
          rm -rf node_modules

      - name: Compile po2lmo
        run: |
          cd sdk/openwrt/package/luci-app-openclash/tools/po2lmo
          make && sudo make install

      - name: Compile package
        env:
          PKG: ${{ env.PKG_NAME }}
        run: |
          set -o pipefail
          cd sdk/openwrt
          make defconfig
          make package/$PKG/compile -j$(nproc) V=s 2>&1 | tail -50

      - name: Check compiled output
        run: |
          echo "=== Hasil compile di bin/packages ==="
          find sdk/openwrt/bin/packages/ -type f | sort || echo "Tidak ada file"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclash-${{ matrix.type }}
          if-no-files-found: error
          path: |
            sdk/openwrt/bin/packages/**/${{ env.PKG_NAME }}*.ipk
            sdk/openwrt/bin/packages/**/${{ env.PKG_NAME }}*.apk

  release:
    runs-on: ubuntu-latest
    needs: [ get_version, build ]

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        if: |
          success() && (
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: OpenClash v${{ needs.get_version.outputs.version }}
          files: |
            dist/**/${{ env.PKG_NAME }}_*.ipk
            dist/**/${{ env.PKG_NAME }}-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPK/APK to Telegram
        if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.upload_telegram == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VERSION: ${{ needs.get_version.outputs.version }}
          PKG: ${{ env.PKG_NAME }}
        run: |
          shopt -s globstar nullglob
          ls -R dist | head -30
          for file in dist/**/${PKG}_*.ipk dist/**/${PKG}-*.apk; do
            FILENAME=$(basename "$file")
            for i in 1 2 3; do
              resp=$(curl -s --max-time 300 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TG_CHAT_ID}" \
                -F document=@"$file" \
                -F caption="🚀 OpenClash v${VERSION} | 📦 ${FILENAME}")
              echo "$FILENAME try $i -> $(echo "$resp" | cut -c1-200)"
              echo "$resp" | grep -q '"ok":true' && break
              sleep 5
            done
            sleep 2
          done
          
